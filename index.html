<script>

// 新しいformatV関数：10^15 (1000兆) を単位区切りとする
function formatV(val) {
    let n = BigInt(val);
    if (n < 1000000000000000n) return n.toLocaleString();
    
    const units = ["aa", "ab", "ac", "ad", "ae", "af", "ag", "ah", "ai", "aj", "ak", "al", "am", "an", "ao", "ap", "aq", "ar", "as", "at", "au", "av", "aw", "ax", "ay", "az"];
    let unitIdx = -1;
    let base = n;
    
    // 1000兆 (10^15) ごとに単位を繰り上げる
    while (base >= 1000000000000000n && unitIdx < units.length - 1) {
        base /= 1000000000000000n;
        unitIdx++;
    }
    
    let remainder = (n / 1000000000000000n).toString().substring(0, 3); // 簡易的な小数部表示
    return base.toString() + "." + remainder.substring(1) + units[unitIdx];
}
